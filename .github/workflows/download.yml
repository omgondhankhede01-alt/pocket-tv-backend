name: Cloud Movie Downloader

on:
  workflow_dispatch:
    inputs:
      movie_name:
        description: 'Name of the movie or series to download'
        required: true
        type: string

concurrency: 
  group: telegram-downloader
  cancel-in-progress: false

jobs:
  download_and_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          pip install telethon beautifulsoup4 requests google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Downloader & Upload to Drive
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MOVIE_NAME: ${{ inputs.movie_name }}
        run: python downloader.py

      - name: Commit Updated movies.json
        run: |
          git config --global user.name "PocketFlix Bot"
          git config --global user.email "bot@pocketflix.local"
          git add movies.json
          git commit -m "Auto-updated movie library from Drive" || echo "No changes to commit"
          git push
