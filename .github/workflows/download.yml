name: Reset Quota (Clone File)

on:
  workflow_dispatch:
    inputs:
      movie_title:
        description: 'Movie or Episode name to reset (e.g., Chainsaw Man or Dhamaal)'
        required: true
        type: string

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google Client
        run: pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Clone Locked File & Refresh ID
        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          TARGET_NAME: ${{ inputs.movie_title }}
        run: |
          python - << 'EOF'
          import os
          import json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds = Credentials(
              token=None,
              refresh_token=os.environ.get("GCP_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("GCP_CLIENT_ID"),
              client_secret=os.environ.get("GCP_CLIENT_SECRET")
          )
          service = build('drive', 'v3', credentials=creds)
          folder_id = os.environ.get("DRIVE_FOLDER_ID")
          target = os.environ.get("TARGET_NAME", "").strip().lower()

          with open("movies.json", "r", encoding="utf-8") as f:
              movies = json.load(f)

          updated = False
          for item in movies:
              if target in item.get("name", "").lower():
                  old_id = item["id"]
                  file_name = item["name"]
                  print(f"[*] Found locked file: {file_name} (ID: {old_id})")

                  # 1. Clone file server-side (0 MB bandwidth, takes 1 second)
                  copy_metadata = {
                      'name': file_name,
                      'parents': [folder_id] if folder_id else []
                  }
                  copied_file = service.files().copy(fileId=old_id, body=copy_metadata).execute()
                  new_id = copied_file.get("id")
                  print(f"[+] Cloned successfully! New fresh File ID: {new_id}")

                  # 2. Grant public view permission to the new clone
                  service.permissions().create(
                      fileId=new_id,
                      body={"type": "anyone", "role": "reader"}
                  ).execute()

                  # 3. Delete the old rate-limited file
                  try:
                      service.files().delete(fileId=old_id).execute()
                      print(f"[*] Deleted old locked file ({old_id})")
                  except Exception as e:
                      print(f"[-] Could not delete old file: {e}")

                  # 4. Update the JSON entry
                  item["id"] = new_id
                  item["webViewLink"] = f"https://drive.google.com/file/d/{new_id}/view"
                  item["webContentLink"] = f"https://drive.google.com/uc?id={new_id}&export=download"
                  updated = True
                  break

          if updated:
              with open("movies.json", "w", encoding="utf-8") as f:
                  json.dump(movies, f, indent=4)
              print("[+] movies.json updated with fresh File ID.")
          else:
              print("[-] No matching file found in movies.json.")
              exit(1)
          EOF

      - name: Commit & Push Updated movies.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Reset quota for ${{ inputs.movie_title }}" && git push origin main)
