name: PocketFlix Engine (Download & Quota Reset)

on:
  workflow_dispatch:
    inputs:
      movie_name:
        description: 'Movie / Episode Title'
        required: true
        type: string
      action:
        description: 'Action to perform'
        required: true
        default: 'download'
        type: choice
        options:
          - download
          - reset_quota

jobs:
  # ==========================================
  # STAGE 1: WEB SCRAPING QUEUE
  # ==========================================
  web_scrape:
    name: Web Scraper (Filmyzilla / AnimaHD)
    if: ${{ github.event.inputs.action != 'reset_quota' }}
    runs-on: ubuntu-latest
    outputs:
      downloaded: ${{ steps.run_web.outputs.downloaded }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 telethon google-api-python-client google-auth-httplib2 google-auth-oauthlib playwright
          playwright install chromium

      - name: Run Web Scraper
        id: run_web
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MOVIE_NAME: ${{ github.event.inputs.movie_name }}
          RUN_MODE: "web"
        run: |
          python downloader.py

      - name: Commit & Push movies.json
        if: steps.run_web.outputs.downloaded == 'true'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add ${{ github.event.inputs.movie_name }} via Web" && git push origin main)

  # ==========================================
  # STAGE 2: TELEGRAM FALLBACK QUEUE
  # ==========================================
  telegram_fallback:
    name: Telegram Fallback Bots
    needs: web_scrape
    if: ${{ github.event.inputs.action != 'reset_quota' && needs.web_scrape.outputs.downloaded != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 telethon google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Run Telegram Fallback
        id: run_tg
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          MOVIE_NAME: ${{ github.event.inputs.movie_name }}
          RUN_MODE: "telegram"
        run: |
          python downloader.py

      - name: Commit & Push movies.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add ${{ github.event.inputs.movie_name }} via Telegram" && git push origin main)

  # ==========================================
  # STAGE 3: QUOTA RESET
  # ==========================================
  reset_quota:
    name: Reset 24-Hour Drive Quota
    if: ${{ github.event.inputs.action == 'reset_quota' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google API Client
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Clone Locked File & Refresh ID
        env:
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          TARGET_NAME: ${{ github.event.inputs.movie_name }}
        run: |
          python - << 'EOF'
          import os, json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build

          creds = Credentials(
              token=None,
              refresh_token=os.environ.get("GCP_REFRESH_TOKEN"),
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ.get("GCP_CLIENT_ID"),
              client_secret=os.environ.get("GCP_CLIENT_SECRET")
          )
          service = build('drive', 'v3', credentials=creds)
          folder_id = os.environ.get("DRIVE_FOLDER_ID")
          target = os.environ.get("TARGET_NAME", "").strip().lower()

          with open("movies.json", "r", encoding="utf-8") as f:
              movies = json.load(f)

          updated = False
          for item in movies:
              if target in item.get("name", "").lower():
                  old_id = item["id"]
                  file_name = item["name"]
                  print(f"[*] Found target file: '{file_name}' (Current ID: {old_id})")

                  copy_metadata = {'name': file_name, 'parents': [folder_id] if folder_id else []}
                  copied_file = service.files().copy(fileId=old_id, body=copy_metadata).execute()
                  new_id = copied_file.get("id")
                  print(f"[+] Fresh File ID: {new_id}")

                  service.permissions().create(fileId=new_id, body={"type": "anyone", "role": "reader"}).execute()

                  try:
                      service.files().delete(fileId=old_id).execute()
                  except Exception as e:
                      print(f"[-] Could not delete old file: {e}")

                  item["id"] = new_id
                  item["webViewLink"] = f"https://drive.google.com/file/d/{new_id}/view"
                  item["webContentLink"] = f"https://drive.google.com/uc?id={new_id}&export=download"
                  updated = True
                  break

          if updated:
              with open("movies.json", "w", encoding="utf-8") as f:
                  json.dump(movies, f, indent=4)
          else:
              exit(1)
          EOF

      - name: Commit & Push movies.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add movies.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Reset quota for ${{ github.event.inputs.movie_name }}" && git push origin main)
